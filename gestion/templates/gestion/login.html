{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Restaurante Pasta La Vista</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- CSS Global -->
    <link rel="stylesheet" href="{% static 'gestion/global.css' %}">
    
    <style>
        body {
            background: linear-gradient(135deg, #722f37 0%, #5a2530 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .auth-container {
            width: 100%;
            max-width: 420px;
        }
        
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .auth-header {
            background: linear-gradient(135deg, #722f37 0%, #5a2530 100%);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        
        .auth-header h1 {
            font-size: 1.8rem;
            margin: 0.5rem 0 0.25rem;
            color: white;
            border: none;
        }
        
        .auth-body {
            padding: 2rem 1.5rem;
        }
        
        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            padding: 1rem;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .auth-tab.active {
            color: #722f37;
            border-bottom-color: #722f37;
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .btn-auth {
            background: linear-gradient(135deg, #722f37 0%, #5a2530 100%);
            color: white;
            width: 100%;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
        }
        
        .btn-auth:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🍝</div>
                <h1>Pasta La Vista</h1>
                <p style="margin: 0; opacity: 0.9;">Sistema de Gestión</p>
            </div>
            
            <div class="auth-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
                
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="showForm('login', event)">
                        <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                    </button>
                    <button class="auth-tab" onclick="showForm('register', event)">
                        <i class="bi bi-person-plus"></i> Registrarse
                    </button>
                </div>
                
                <form id="login" class="auth-form active" method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="username" class="form-label"><i class="bi bi-person"></i> Usuario</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Tu usuario" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label"><i class="bi bi-lock"></i> Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Tu contraseña" required>
                    </div>
                    
                    <button type="submit" class="btn btn-auth">Iniciar Sesión</button>
                </form>
                
                <form id="register" class="auth-form" method="POST" action="{% url 'register' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="reg_username" class="form-label"><i class="bi bi-person"></i> Usuario</label>
                        <input type="text" id="reg_username" name="username" class="form-control" placeholder="Elige un usuario" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="reg_email" class="form-label"><i class="bi bi-envelope"></i> Correo</label>
                        <input type="email" id="reg_email" name="email" class="form-control" placeholder="Tu correo" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="reg_password1" class="form-label"><i class="bi bi-lock"></i> Contraseña</label>
                        <input type="password" id="reg_password1" name="password1" class="form-control" placeholder="Contraseña fuerte" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="reg_password2" class="form-label"><i class="bi bi-lock"></i> Confirmar</label>
                        <input type="password" id="reg_password2" name="password2" class="form-control" placeholder="Confirma tu contraseña" required>
                    </div>
                    
                    <button type="submit" class="btn btn-auth">Registrarse</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showForm(formId, event) {
            event.preventDefault();
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(formId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
